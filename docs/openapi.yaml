        mediaItemId:
          type: integer
        filename:
          type: string
          readOnly: true
        foldername:
          type: string
          readOnly: true
        mediaType:
          type: string
          readOnly: true
        mediaDate:
          type: string
          format: date-time
          readOnly: true
        animalCount:
          type: integer
        weatherDescription:
          type: string
          nullable: true
        objectCount:
          type: integer
        creationDate:
          type: string
          format: date-time
          nullable: true
        locationDescription:
          type: string
          nullable: true
        formatOfDocumentOrImage:
          type: string
          nullable: true
        detailedImageAnalysis:
          type: string
          nullable: true
        temperaturMinCelsius:
          type: integer
          nullable: true
        temperaturMaxCelsius:
          type: integer
          nullable: true
        modelTemperature:
