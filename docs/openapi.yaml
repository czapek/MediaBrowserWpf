openapi: 3.0.3
info:
  title: MediaBrowser Spring API
  version: 1.3.0
  description: >
    REST-Vertrag für das Spring-Boot-Backend des MediaBrowserWpf-ApiProviders.
    Die API verwendet JSON (UTF-8). Binärdaten wie Thumbnails werden als
    Base64-Byte-Arrays übertragen, ausgenommen der direkte Thumbnail-Download.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: catalog
  - name: folders
  - name: categories
  - name: mediafiles
  - name: imageanalysis
  - name: variations
  - name: previews
  - name: metadata
  - name: descriptions
  - name: attachments
  - name: roles
  - name: gps
  - name: meteorology
  - name: requests
  - name: duplicates
  - name: maintenance

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access- und Refresh-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Ungültige Zugangsdaten
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Neuer Access-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh-Token ungültig oder abgelaufen
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh-Token widerrufen

  /catalog/validate:
    get:
      tags: [catalog]
      operationId: validateCatalog
      responses:
        '200':
          description: Katalogstatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogInfo'
  /catalog/create:
    post:
      tags: [catalog]
      operationId: createCatalog
      responses:
        '204':
          description: Katalog wurde angelegt
  /catalog/properties:
    get:
      tags: [catalog]
      operationId: getCatalogProperties
      responses:
        '200':
          description: Katalogweite Eigenschaften
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    put:
      tags: [catalog]
      operationId: saveCatalogProperties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '204':
          description: Eigenschaften gespeichert
  /catalog/last-folders:
    get:
      tags: [catalog]
      operationId: getLastAddedFolders
      responses:
        '200':
          description: Zuletzt hinzugefügte Ordner
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: date-time
  /catalog/capabilities:
    get:
      tags: [catalog]
      operationId: getCapabilities
      responses:
        '200':
          description: Verfügbare API-Funktionen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'

  /folders:
    get:
      tags: [folders]
      operationId: getFolders
      responses:
        '200':
          description: Ordnerliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
  /folders/ensure:
    post:
      tags: [folders]
      operationId: ensureFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Folder'
      responses:
        '200':
          description: Angelegter oder bestehender Ordner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
  /folders/{id}:
    delete:
      tags: [folders]
      operationId: deleteFolder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Ordner gelöscht
  /folders/{id}/count:
    get:
      tags: [folders]
      operationId: countFolderItems
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Anzahl der Medien im Ordner
          content:
            application/json:
              schema:
                type: integer

  /categories/tree:
    get:
      tags: [categories]
      operationId: getCategoryTree
      responses:
        '200':
          description: Flache Kategorienliste mit Parent-Beziehungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /categories:
    get:
      tags: [categories]
      operationId: getCategoriesForVariation
      parameters:
        - name: variationId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Kategorien einer Variation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [categories]
      operationId: saveCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Gespeicherte Kategorie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /categories/by-path:
    post:
      tags: [categories]
      operationId: saveCategoryByPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathRequest'
      responses:
        '200':
          description: Kategorie anhand des Pfads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /categories/{id}:
    delete:
      tags: [categories]
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Kategorie gelöscht
  /categories/geo:
    get:
      tags: [categories]
      operationId: getGeoCategories
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [diary, location]
        - name: longitude
          in: query
          schema:
            type: number
        - name: width
          in: query
          schema:
            type: number
        - name: latitude
          in: query
          schema:
            type: number
        - name: height
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Kategorien im Geodatenbereich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /categories/from-media:
    post:
      tags: [categories]
      operationId: getCategoriesFromMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        '200':
          description: Kategorien mit Anzahl pro Variation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryCount'
  /categories/identifiers/{variationId}:
    get:
      tags: [categories]
      operationId: getCategoryIdentifiers
      parameters:
        - $ref: '#/components/parameters/VariationId'
      responses:
        '200':
          description: Kategorie-IDs einer Variation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /mediafiles/query:
    post:
      tags: [mediafiles]
      operationId: queryMediaFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaQuery'
      responses:
        '200':
          description: Gefundene Medien
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'
  /mediafiles/sql-query:
    post:
      tags: [mediafiles]
      operationId: executeSqlQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQuery'
      responses:
        '200':
          description: Medien aus SQL-Abfrage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'
  /mediafiles/sql-request:
    get:
      tags: [mediafiles]
      operationId: getSqlRequest
      parameters:
        - name: mediaItemIds
          in: query
          required: true
          schema:
            type: string
            example: 1,2,3
      responses:
        '200':
          description: SQL-Anfrage für eine Medienliste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlQuery'
  /mediafiles/insert:
    post:
      tags: [mediafiles]
      operationId: insertMediaFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaInsert'
      responses:
        '200':
          description: Ergebnis des Imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertResult'
  /mediafiles/{id}:
    get:
      tags: [mediafiles]
      operationId: getMediaFile
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Medienobjekt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '404':
          description: Nicht gefunden
    put:
      tags: [mediafiles]
      operationId: updateMediaFile
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaItem'
      responses:
        '204':
          description: Medienobjekt aktualisiert
  /mediafiles/{id}/content:
    get:
      tags: [mediafiles]
      operationId: getMediaContent
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Range
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Originalinhalt
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Teilinhalt für Range-Request
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Inhalt nicht vorhanden
        '409':
          description: Kein Content Store konfiguriert
    head:
      tags: [mediafiles]
      operationId: headMediaContent
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Content-Metadaten
        '404':
          description: Inhalt nicht vorhanden
  /mediafiles/{id}/sidecars:
    get:
      tags: [mediafiles]
      operationId: getSidecars
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Read-only Sidecar-Dateien
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sidecar'
  /mediafiles/{id}/description:
    get:
      tags: [mediafiles]
      operationId: getMediaDescription
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Beschreibung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Text'
  /mediafiles/{id}/variations:
    get:
      tags: [mediafiles, variations]
      operationId: getVariations
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: includeThumbs
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Variationen des Medienobjekts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variation'
    post:
      tags: [mediafiles, variations]
      operationId: createVariation
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariationCreate'
      responses:
        '200':
          description: Neue Variation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variation'
    delete:
      tags: [mediafiles, variations]
      operationId: deleteVariationByName
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Variation entfernt
  /mediafiles/{id}/variations/replace:
    post:
      tags: [mediafiles, variations]
      operationId: replaceVariations
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Variation'
      responses:
        '200':
          description: Neue Variationen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variation'
  /mediafiles/actions:
    post:
      tags: [mediafiles]
      operationId: executeMediaAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAction'
      responses:
        '204':
          description: Aktion ausgeführt
  /mediafiles/thumbs:
    post:
      tags: [mediafiles]
      operationId: getThumbs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        '200':
          description: Thumbnails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thumb'
  /mediafiles/checksum-count:
    get:
      tags: [mediafiles]
      operationId: getChecksumCount
      parameters:
        - name: checksum
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Anzahl der Treffer
          content:
            application/json:
              schema:
                type: integer
  /mediafiles/from-xml:
    post:
      tags: [mediafiles]
      operationId: importXml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XmlImport'
      responses:
        '200':
          description: Importierte Medien in Reihenfolge der Anfrage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'

  /mediafiles/{id}/image-analysis:
    get:
      tags: [imageanalysis]
      operationId: getImageAnalysis
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: KI-/OCR-Analyse des Medienobjekts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysis'
        '404':
          description: Medienobjekt oder Analyse nicht gefunden
    put:
      tags: [imageanalysis]
      operationId: upsertImageAnalysis
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageAnalysisUpsert'
      responses:
        '204':
          description: Analyse gespeichert oder ersetzt
        '400':
          description: Ungültige Analysedaten
        '404':
          description: Medienobjekt nicht gefunden
    delete:
      tags: [imageanalysis]
      operationId: deleteImageAnalysis
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Analyse und Kindzeilen entfernt
        '404':
          description: Medienobjekt nicht gefunden
  /image-analysis/query:
    post:
      tags: [imageanalysis]
      operationId: queryImageAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageAnalysisQuery'
      responses:
        '200':
          description: Gefundene KI-/OCR-Analysen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageAnalysis'

  /image-analysis/search:
    post:
      tags: [imageanalysis]
      operationId: searchImageAnalysisMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageAnalysisSearchRequest'
      responses:
        '200':
          description: MediaItems, die den Analysefiltern entsprechen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisSearchResult'
        '400':
          description: Ungültige Filter, Sortierung oder Pagination
  /image-analysis/value-search:
    get:
      tags: [imageanalysis]
      operationId: searchImageAnalysisValues
      parameters:
        - name: field
          in: query
          required: true
          schema:
            type: string
            enum: [OBJECT_NAME, WEATHER_DESCRIPTION, LOCATION_DESCRIPTION]
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 3
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Passende distinkte Werte für Autocomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisValueSearchResult'
        '400':
          description: Ungültiges Feld oder ungültiger Suchbegriff
  /image-analysis/filter-fields:
    get:
      tags: [imageanalysis]
      operationId: getImageAnalysisFilterFields
      responses:
        '200':
          description: Verfügbare Filterfelder und passende Frontend-Controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageAnalysisFilterField'
  /image-analysis/ranges:
    get:
      tags: [imageanalysis]
      operationId: getImageAnalysisRanges
      responses:
        '200':
          description: Wertebereiche für Zahlen- und Zählerfilter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisRanges'

  /variations/{id}:
    put:
      tags: [variations]
      operationId: updateVariation
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Variation'
      responses:
        '204':
          description: Variation aktualisiert
    delete:
      tags: [variations]
      operationId: deleteVariation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Variation gelöscht
  /variations/{id}/default:
    post:
      tags: [variations]
      operationId: setDefaultVariation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Variation ist jetzt Standard
  /variations/{id}/layers:
    get:
      tags: [variations]
      operationId: getLayers
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ebenen der Variation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Layer'
    put:
      tags: [variations]
      operationId: setLayers
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Layer'
      responses:
        '204':
          description: Ebenen gespeichert
  /variations/{id}/thumb:
    get:
      tags: [variations, mediafiles]
      operationId: getThumb
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: width
          in: query
          schema:
            type: integer
            default: 0
        - name: height
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Thumbnail-Binärdaten
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Kein Thumbnail vorhanden
    put:
      tags: [variations, mediafiles]
      operationId: setThumb
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThumbUpload'
      responses:
        '204':
          description: Thumbnail gespeichert

  /previews/{variationId}:
    get:
      tags: [previews]
      operationId: getPreview
      parameters:
        - $ref: '#/components/parameters/VariationId'
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vorschau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
        '404':
          description: Keine Vorschau vorhanden
  /previews/exists:
    get:
      tags: [previews]
      operationId: previewExists
      parameters:
        - name: variationId
          in: query
          required: true
          schema:
            type: integer
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vorschau vorhanden
          content:
            application/json:
              schema:
                type: boolean
  /previews/variation-ids:
    get:
      tags: [previews]
      operationId: getPreviewVariationIds
      parameters:
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Variations-IDs mit Vorschau
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /faces/previews/{variationId}:
    get:
      tags: [previews]
      operationId: getFacePreview
      parameters:
        - $ref: '#/components/parameters/VariationId'
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gesichter der Vorschau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacePreview'
  /faces:
    get:
      tags: [previews]
      operationId: getFaceCounts
      parameters:
        - name: width
          in: query
          required: true
          schema:
            type: integer
        - name: height
          in: query
          required: true
          schema:
            type: integer
        - name: min
          in: query
          required: true
          schema:
            type: number
        - name: max
          in: query
          required: true
          schema:
            type: number
        - name: countMin
          in: query
          required: true
          schema:
            type: integer
        - name: countMax
          in: query
          required: true
          schema:
            type: integer
        - name: variationIds
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Gesichtsanzahl je Variation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaceCount'

  /metadata/query:
    post:
      tags: [metadata]
      operationId: queryMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        '200':
