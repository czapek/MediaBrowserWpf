components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    VariationId:
      name: variationId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        tenant:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Gültigkeit des Access-Tokens in Sekunden
          example: 600
    Capabilities:
      type: object
      properties:
        canReadContent:
          type: boolean
        canStreamRange:
          type: boolean
        canReadAttachments:
          type: boolean
        canReadSidecars:
          type: boolean
        canWriteCatalog:
          type: boolean
        canUploadContent:
          type: boolean
          example: false
        canModifyFiles:
          type: boolean
          example: false
        contentStoreConfigured:
          type: boolean
    CatalogInfo:
      type: object
      properties:
        valid:
          type: boolean
        guid:
          type: string
        dbName:
          type: string
        user:
          type: string
        host:
          type: string
        message:
          type: string
    Folder:
      type: object
      properties:
        id:
          type: integer
        foldername:
          type: string
        itemCount:
          type: integer
    Category:
      type: object
      properties:
        id:
          type: integer
        parentId:
          type: integer
        name:
          type: string
        sortname:
          type: string
        description:
          type: string
        fullPath:
          type: string
        guid:
          type: string
        isDate:
          type: boolean
        isLocation:
          type: boolean
        isUnique:
          type: boolean
        date:
          type: string
          format: date-time
          nullable: true
        longitude:
          type: number
          nullable: true
        latitude:
          type: number
          nullable: true
        itemCount:
          type: integer
    CategoryCount:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/Category'
        count:
          type: integer
    Layer:
      type: object
      properties:
        position:
          type: integer
        edit:
          type: string
        action:
          type: string
    Variation:
      type: object
      properties:
        id:
          type: integer
        mediaItemId:
          type: integer
        position:
          type: integer
        name:
          type: string
        description:
          type: string
        isOutdated:
          type: boolean
        thumb:
          type: string
          format: byte
          nullable: true
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
    VariationCreate:
      type: object
      properties:
        name:
          type: string
        setDefault:
          type: boolean
        layerAction:
          type: string
        layerEdit:
          type: string
        thumb:
          type: string
          format: byte
          nullable: true
    MediaItem:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        foldername:
          type: string
        sortorder:
          type: string
        md5Value:
          type: string
        fileLength:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        viewed:
          type: integer
        duration:
          type: number
        frames:
          type: integer
        orientation:
          type: integer
        type:
          type: string
          enum: [rgb, dsh]
        isBookmarked:
          type: boolean
        isDeleted:
          type: boolean
        isDuplicate:
          type: boolean
        isFileNotFound:
          type: boolean
        priority:
          type: integer
        roleId:
          type: integer
        variationId:
          type: integer
        defaultVariationId:
          type: integer
        currentVariationId:
          type: integer
          nullable: true
        descriptionId:
          type: integer
          nullable: true
        description:
          type: string
        creationDate:
          type: string
          format: date-time
        mediaDate:
          type: string
          format: date-time
        editDate:
          type: string
          format: date-time
        insertDate:
          type: string
          format: date-time
        longitude:
          type: number
          nullable: true
        latitude:
          type: number
          nullable: true
        isThumbOutdated:
          type: boolean
        thumb:
          type: string
          format: byte
          nullable: true
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/MetaData'
    MediaInsert:
      allOf:
        - $ref: '#/components/schemas/MediaItem'
        - type: object
          properties:
            variationName:
              type: string
            variationPosition:
              type: integer
            layers:
              type: array
              items:
                $ref: '#/components/schemas/Layer'
            categories:
              type: array
              items:
                $ref: '#/components/schemas/Category'
    InsertResult:
      type: object
      properties:
        mediaItemId:
          type: integer
        variationId:
          type: integer
        defaultVariationId:
          type: integer
        isDuplicate:
          type: boolean
        message:
          type: string
    MediaQuery:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [SEARCH, FOLDERS, CATEGORIES, MISSING_CATEGORIES, MISSING_FILES, MISSING_THUMBS, FILES_FROM_LIST, FILES_FROM_CHECKSUM, SORT, DUPLICATES, GEO, VIRTUAL, TRASH, BOOKMARKS, CHECKSUM, FILENAME, FILE_PATH, REQUEST]
        mediaItemIds:
          type: array
          items:
            type: integer
        folderIds:
          type: array
          items:
            type: integer
        categoryIds:
          type: array
          items:
            type: integer
        variationIds:
          type: array
          items:
            type: integer
        fileNames:
          type: array
          items:
            type: string
        filePath:
          type: string
        checksum:
          type: string
        sortString:
          type: string
        limit:
          type: integer
        storeView:
          type: boolean
        isIntersection:
          type: boolean
        isRecursive:
          type: boolean
        categoryRequestType:
          type: string
        searchToken:
          $ref: '#/components/schemas/SearchToken'
        longitude:
          type: number
        latitude:
          type: number
        width:
          type: number
        height:
          type: number
        requestTicket:
          type: integer
          format: int64
        sql:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/SqlParameter'
        sortFields:
          type: array
          items:
            type: string
        criteria:
          type: string
    SqlParameter:
      type: object
      properties:
        name:
          type: string
        value: {}
    SqlQuery:
      type: object
      properties:
        sql:
          type: string
        sortString:
          type: string
        limit:
          type: integer
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/SqlParameter'
    MediaAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [CHECK, SET_ROLE, SET_PRIORITY, SET_BOOKMARK, SET_DELETED, SET_TRASH, SET_GEODATA, ADJUST_MEDIA_DATE, ADD_VIEW_TIME, RENAME, COPY_TO_FOLDER, REMOVE_AND_RECYCLE, REMOVE_FROM_DB, ROTATE_90, CATEGORIZE, UNCATEGORIZE, UPDATE_DUPLICATE]
        mediaItemIds:
          type: array
          items:
            type: integer
        variationIds:
          type: array
          items:
            type: integer
        categoryIds:
          type: array
          items:
            type: integer
        folderIds:
          type: array
          items:
            type: integer
        roleId:
          type: integer
        priority:
          type: integer
        flag:
          type: boolean
        longitude:
          type: number
        latitude:
          type: number
        newName:
          type: string
        mediaDate:
          type: string
          format: date-time
        variationName:
          type: string
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        criteria:
          type: string
        seconds:
          type: integer
    MetaData:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        groupName:
          type: string
        value:
          type: string
        type:
          type: string
        isVisible:
          type: boolean
        isNull:
          type: boolean
    ImageObject:
      type: object
      required: [objectName]
      properties:
        id:
          type: integer
          readOnly: true
        objectName:
          type: string
    ImageReadableText:
      type: object
      required: [textLine]
      properties:
        id:
          type: integer
          readOnly: true
        textLine:
          type: string
    ImageAnalysis:
      type: object
