        animalCount:
          type: integer
        weatherDescription:
          type: string
          nullable: true
        objectCount:
          type: integer
        creationDate:
          type: string
          format: date-time
          nullable: true
        locationDescription:
          type: string
          nullable: true
        formatOfDocumentOrImage:
          type: string
          nullable: true
        detailedImageAnalysis:
          type: string
          nullable: true
        temperaturMinCelsius:
          type: integer
          nullable: true
        temperaturMaxCelsius:
          type: integer
          nullable: true
        modelTemperature:
